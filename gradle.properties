org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=true

# The network here is intermittent, so prefer waiting over failing a long build.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

mod_id=touhou_maid_legion
mod_name=Maid Legion
# Shown in the in-game mod list. Kept separate from mod_id (which must stay ASCII) so the
# displayed name can be localised without touching the internal identifiers.
mod_display_name=女仆军团
# Loader this build targets. This mod is Forge-only: it uses Forge's SimpleChannel,
# ForgeChunkManager and @Mod API, none of which exist on Fabric.
mod_loader=forge
mod_version=1.3.1
mod_group=com.dsh.maidmanager
mod_authors=DSH
mod_description=女仆军团：从一个面板批量管理、召唤与强化你的车万女仆。\nMaid Legion: manage, summon and strengthen your Touhou Little Maid legion from one panel.

mc_version=1.20.1
forge_version=1.20.1-47.2.0
mapping_channel=parchment
mapping_version=2023.08.20-1.20.1

# --- 可选配置（默认全部关闭，不填即可正常构建）-------------------------------------
# 代理：仅当无法直连 maven.minecraftforge.net / maven.neoforged.net 时才需要。
# 填 host:port，例如 proxy=127.0.0.1:7897
# 也可用环境变量 MAID_LEGION_PROXY（优先级更高，不必把代理地址提交进仓库）。
# build.gradle 会自动把 Mojang CDN、Gradle、Maven Central、Parchment 加入
# nonProxyHosts —— 这些站点直连更稳，全局代理反而会让它们握手失败。
#
# proxy=

# JDK 路径提示：通常不需要，Gradle 会自己找。只有自动探测挑错 JDK 时才填，逗号分隔。
# 也可用环境变量 MAID_LEGION_JDK_PATHS
#
# jdk_paths=/path/to/jdk-17
