org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=true

# The network here is intermittent, so prefer waiting over failing a long build.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# --- 代理（可选，默认关闭）-------------------------------------------------------------
# 若你的网络无法直连 maven.neoforged.net，把下面这行取消注释并填上代理地址。
# 格式：host:port，例如 proxy=127.0.0.1:7897
# build.gradle 会自动设置 http/https 代理，并把 Mojang CDN、Gradle、Maven Central、
# Parchment 加入 nonProxyHosts —— 因为这些站点走直连反而更稳，全局代理会让它们握手失败。
#
# 也可以用环境变量代替（优先级更高，便于 CI/他人使用）：
#   MAID_LEGION_PROXY=127.0.0.1:7897
#
# proxy=

# 可选的 JDK 安装路径提示（Gradle toolchain 用来自动定位 JDK 21）。
# 不填也能构建：Gradle 会自己下载或从 JAVA_HOME / 系统注册表里找。
# 只有自动探测失败、或想固定某个 JDK 时才需要设置，逗号分隔。
# 也可用环境变量 MAID_LEGION_JDK_PATHS
#
# jdk_paths=/path/to/jdk-21

mod_id=touhou_maid_legion
mod_name=Maid Legion
# Shown in the in-game mod list. Kept separate from mod_id (which must stay ASCII) so the
# displayed name can be localised without touching the internal identifiers.
mod_display_name=女仆军团
# Loader this build targets. Minecraft 1.21 ships NeoForge only - Forge never released a
# 1.21 build, and Touhou Little Maid is NeoForge-only on 1.21.1 as well.
mod_loader=neoforge
mod_version=1.3.1
mod_group=com.dsh.maidmanager
mod_authors=DSH
mod_description=女仆军团：从一个面板批量管理、召唤与强化你的车万女仆。\nMaid Legion: manage, summon and strengthen your Touhou Little Maid legion from one panel.

mc_version=1.21.1
neoforge_version=21.1.209
mapping_channel=parchment
mapping_version=2024.11.17-1.21.1

